# Single Agent Server. Robots run independently via compose.robot.yaml.
name: agenticros-${ROS_DOMAIN_ID:-42}
services:
  server:
    build:
      context: .
      dockerfile: docker/agent_instance/agent/Dockerfile
      target: server
    image: agenticros-server:single
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: "0"
      ROS_LOG_DIR: /workspace/ros_logs
      RMW_FASTRTPS_PUBLICATION_MODE: ASYNCHRONOUS
    command: [python3, /opt/instance/runtime.py, serve]
    volumes:
      - type: bind
        source: ${AGENTICROS_WORKSPACE:-./runs/${ROS_DOMAIN_ID:-42}/agent_instance/agent/workspace}
        target: /workspace
        bind:
          create_host_path: true
      - type: bind
        source: ./docker/robot_instances/robot_docs
        target: /workspace/robot_docs
        read_only: true
        bind:
          create_host_path: false
      - codex-home:/home/agent/.codex
      - ./docker/agent_instance/agent/codex.toml:/config/codex.toml:ro
    group_add: ["${AGENTICROS_WORKSPACE_GID:-1000}"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stdin_open: true
    tty: true
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python3, /opt/instance/runtime.py, health]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 15s
  viewer:
    profiles: [viewer]
    build:
      context: .
      dockerfile: docker/agent_instance/viewer/Dockerfile
    image: agenticros-viewer:single
    network_mode: host
    ipc: host
    init: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: "0"
      AGENTICROS_VIEWER_PORT: ${AGENTICROS_VIEWER_PORT:-8080}
      AGENTICROS_VNC_PORT: ${AGENTICROS_VNC_PORT:-5900}
      AGENTICROS_VIEWER_BIND: ${AGENTICROS_VIEWER_BIND:-127.0.0.1}
    volumes:
      - viewer-auth:/viewer-auth
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python3, /opt/viewer/healthcheck.py]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 15s

  sam3:
    profiles: [sam3]
    build:
      context: .
      dockerfile: docker/agent_instance/sam3/Dockerfile
      target: sam3
    image: agenticros-sam3:single
    network_mode: host
    ipc: private
    shm_size: 1gb
    user: "${AGENTICROS_HOST_UID:-1000}:${AGENTICROS_WORKSPACE_GID:-1000}"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: "0"
      RMW_FASTRTPS_PUBLICATION_MODE: ASYNCHRONOUS
      SAM3_CHECKPOINT: /models/sam3.pt
      SAM3_RECORDS: /records
      HOME: /tmp
      ROS_LOG_DIR: /tmp/ros_logs
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ./runs/${ROS_DOMAIN_ID:-42}/agent_instance/sam3/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runs/${ROS_DOMAIN_ID:-42}/agent_instance/sam3/records
        target: /records
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 60s

volumes:
  viewer-auth:
    name: ${AGENTICROS_VIEWER_VOLUME:-agenticros-${ROS_DOMAIN_ID:-42}_viewer-auth}
  codex-home:
    name: ${AGENTICROS_CODEX_VOLUME:-agenticros-${ROS_DOMAIN_ID:-42}_codex-home}
