# Single Agent Server. Robots run independently via compose.client.yaml.
name: agenticros
services:
  server:
    build:
      context: .
      dockerfile: docker/agent_instance/Dockerfile
      target: server
    image: agenticros-server:single
    network_mode: host
    ipc: host
    environment:
      AGENTICROS_VIEWER_PORT: ${AGENTICROS_VIEWER_PORT:-8080}
      AGENTICROS_VNC_PORT: ${AGENTICROS_VNC_PORT:-5900}
      AGENTICROS_VIEWER_BIND: ${AGENTICROS_VIEWER_BIND:-127.0.0.1}
      FASTRTPS_DEFAULT_PROFILES_FILE: /tmp/agenticros-lan.xml
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOG_DIR: /workspace/ros_logs
      RMW_FASTRTPS_PUBLICATION_MODE: ASYNCHRONOUS
      AGENTICROS_DDS_HOST: ${AGENTICROS_DDS_HOST:?}
      AGENTICROS_DDS_TRANSPORT: ${AGENTICROS_DDS_TRANSPORT:-tcp}
      AGENTICROS_ADVERTISE_HOST: ${AGENTICROS_DDS_HOST:?}
      AGENTICROS_DDS_PORT: ${AGENTICROS_DDS_PORT:-11811}
      AGENTICROS_DDS_PREFIX: ${AGENTICROS_DDS_PREFIX:-44.53.00.5f.45.50.52.4f.53.49.4d.41}
    command: [python3, /opt/instance/runtime.py, serve]
    volumes:
      - viewer-auth:/viewer-auth
      - type: bind
        source: ./runs/workspace
        target: /workspace
        bind:
          create_host_path: false
      - codex-home:/home/agent/.codex
      - ./docker/agent_instance/agent/codex.toml:/config/codex.toml:ro
    group_add: ["${AGENTICROS_WORKSPACE_GID:-1000}"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stdin_open: true
    tty: true
    init: true
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python3, /opt/instance/runtime.py, health]
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 15s
volumes:
  viewer-auth:
    name: ${AGENTICROS_VIEWER_VOLUME:-agenticros_viewer-auth}
  codex-home:
    name: ${AGENTICROS_CODEX_VOLUME:-agenticros_codex-home}
