# Project, network, images and persistent volumes share the AgenticROS namespace.
name: agenticros
services:
  cartesian_gripper:
    profiles: [simulation]
    build:
      context: .
      dockerfile: docker/robot_instances/cartesian_gripper/Dockerfile
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      BODY_SEED: "${BODY_SEED:-0}"
    volumes:
      - observations:/observations
      - viewer-auth:/viewer-auth
    networks: [robot]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    ports:
      - "127.0.0.1:${AGENTICROS_VIEWER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/opt/body-venv/bin/python", "/opt/agenticros/healthcheck.py"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 20s
  agenticros:
    build:
      context: .
      dockerfile: docker/agent_instance/Dockerfile
      target: agent
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_LOG_DIR: /workspace/ros_logs
    volumes:
      - type: bind
        source: ./runs/${AGENTICROS_WORKSPACE_SUBDIR:-agent_instances/default/workspace}
        target: /workspace
        bind:
          create_host_path: false
      - codex-home:/home/agent/.codex
      - observations:/observations:ro
      - ./docker/agent_instance/agent/codex.toml:/config/codex.toml:ro
    networks: [robot]
    group_add: ["${AGENTICROS_WORKSPACE_GID:-1000}"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stdin_open: true
    tty: true
    init: true
networks:
  robot:
    driver: bridge
volumes:
  observations:
  codex-home:
    name: ${COMPOSE_PROJECT_NAME:-agenticros}_codex-home${AGENTICROS_INSTANCE_SUFFIX:-}
  viewer-auth:
