# Keep the existing project identity to preserve volumes, authentication and network.
name: rosbody
services:
  simple_mujoco:
    profiles: [simulation]
    build:
      context: .
      dockerfile: docker/simple_mujoco/Dockerfile
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      BODY_SEED: "${BODY_SEED:-0}"
    volumes:
      - observations:/observations
    networks: [robot]
    ports:
      - "127.0.0.1:${ROSBODY_VIEWER_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    healthcheck:
      test: ["CMD", "/opt/body-venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/frame.jpg',timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
  agenticros:
    build:
      context: .
      dockerfile: docker/agenticros/Dockerfile
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      ROS_LOG_DIR: /workspace/ros_logs
    volumes:
      - workspace:/workspace
      - codex-home:/home/agent/.codex
      - observations:/observations:ro
      - ./docker/agenticros/codex.toml:/config/codex.toml:ro
    networks: [robot]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stdin_open: true
    tty: true
    init: true
networks:
  robot:
    driver: bridge
volumes:
  workspace:
  observations:
  codex-home:
